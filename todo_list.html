<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>To-Do List</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 20px;
    background: #f3efe7;
    font-family: 'Geist', sans-serif;
    color: #1f1f1d;
    display: flex;
    justify-content: center;
  }

  .wrap { width: 100%; max-width: 700px; }

  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0 0 4px 0;
  }

  .subtitle {
    color: #9a958a;
    font-size: 1rem;
    margin-bottom: 28px;
  }

  .section {
    background: #ffffff;
    border: 1px solid #e8e3d8;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .section-header h2 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0;
  }

  .item-count {
    background: #f0ece2;
    color: #9a958a;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 20px;
  }

  /* ====== ITEM ROW ======
     To add an item, copy a whole <label class="item">...</label> block
     and change the text. To remove one, delete the block.
  */
  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid #ece7db;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .item:last-child { margin-bottom: 0; }

  .item input[type="checkbox"] {
    appearance: none;
    width: 22px;
    height: 22px;
    border: 2px solid #cfc8b8;
    border-radius: 50%;
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
  }

  .item input[type="checkbox"]:checked {
    border-color: #2f8f7e;
    background: #2f8f7e;
  }

  .item input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 2px;
    width: 6px;
    height: 11px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .item span {
    font-size: 0.92rem;
  }

  .item input[type="checkbox"]:checked ~ span {
    text-decoration: line-through;
    color: #b3ad9f;
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>To-Do List</h1>

  <!-- ===== MAIN ===== -->
  <div class="section">
    <div class="section-header">
      <h2>Main</h2>
    </div>
    <label class="item"><input type="checkbox"><span>Stuff for Pacific Advisors</span></label>
    <label class="item"><input type="checkbox"><span>Health Care Reimbursements</span></label>
    <label class="item"><input type="checkbox"><span>Figure out taxes</span></label>
    <label class="item"><input type="checkbox"><span>Finish Watercolor</span></label>
    <label class="item"><input type="checkbox"><span>Book Club Logo</span></label>
    <label class="item"><input type="checkbox"><span>Book Club Plan</span></label>
    <label class="item"><input type="checkbox"><span>Portfolio, jobs, side hustles, writing grant</span></label>
    <label class="item"><input type="checkbox"><span>Savonn</span></label>
    <label class="item"><input type="checkbox"><span>Fix taxes</span></label>
    <label class="item"><input type="checkbox"><span>Dad's books (MF and VI)</span></label>
    <label class="item"><input type="checkbox"><span>Returns</span></label>
    <label class="item"><input type="checkbox"><span>Fix Floors</span></label>


  </div>

  <!-- ===== JOEY ===== -->
  <div class="section">
    <div class="section-header">
      <h2>Joey</h2>
    </div>
    <label class="item"><input type="checkbox"><span>Embroider Bag</span></label>
  </div>

  <!-- ===== KIT ===== -->
  <div class="section">
    <div class="section-header">
      <h2>Kit</h2>
    </div>
    <label class="item"><input type="checkbox"><span>Finish room</span></label>
  </div>

  <!-- ===== LOGGE ===== -->
  <div class="section">
    <div class="section-header">
      <h2>Logge</h2>
    </div>
    <label class="item"><input type="checkbox"><span>Sew curtains</span></label>
    <label class="item"><input type="checkbox"><span>Bind house manual</span></label>
  </div>

</div>

<script>
  // Strikes through items when checked.
</script>
</body>
</html>
